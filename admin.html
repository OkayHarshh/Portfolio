<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 380px;
            padding: 35px;
            background: #171a21;
            border: 1px solid #2b303b;
            border-radius: 16px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d1d5db;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #111318;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        #message {
            margin-top: 15px;
            color: #f87171;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Portfolio Admin</h1>

        <div class="subtitle">
            Owner login
        </div>

        <form id="login-form">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message"></div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Supabase configuration -->
    <script src="supabase.js"></script>


    <script>

        const loginForm = document.getElementById("login-form");
        const message = document.getElementById("message");


        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            message.textContent = "Logging in...";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error(error);

                message.textContent =
                    error.message;

                return;
            }


            console.log("Login successful:", data);

            window.location.href = "dashboard.html";

        });

    </script>

</body>
</html>
